[global]
disableWidgetStateDuplicationWarning = false
showWarningOnDirectExecution = true

[logger]
level = "info"
messageFormat = "%(asctime)s %(message)s"

[client]
showErrorDetails = "full"
toolbarMode = "auto"
showSidebarNavigation = false
showErrorLinks = "auto"
disableDataExport = false

[theme]
base="light"
primaryColor="#A3B087"
linkColor="#E16A54"
borderColor="#A3B087"
backgroundColor="#D2DCB6"
textColor="#313647"
secondaryBackgroundColor="#F1F3E0"
dataframeBorderColor="#313647"
dataframeHeaderBackgroundColor="#F1F3E0"
dataframeHeaderTextColor="#313647"