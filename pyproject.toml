[project]
name = "know-the-process"
version = "0.1.0"
description = "Consulta de procesos de trámites gubernamentales de Panamá"
readme = "README.md"
requires-python = ">= 3.14"
dependencies = [
    "streamlit>=1.66.1",
    "python-dotenv>=1.2.4",
    "playwright>=1.64.1",
]

[project.optional-dependencies]
dev = [
    "pylint>=4.1.3", 
    "pytest>=9.2.0", 
    "black>=26.10.1", 
    "isort>=9.0.2",
]

[build-system]
# requires = ["hatchling"]
# build-backend = "hatchling.build"
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"


# [tool.hatch.build.targets.wheel]
# packages = ["app"]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["test", "build", "dist*", "*.egg-info*"]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
pythonPlatform = "All"

include = ["."]

exclude = [
    "**/__pycache__",
    "**/build",
    "**/dist",
    "**/.venv",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/.*",
]

# [server]
# enableXsrfProtection = true
# enableCORS = true

