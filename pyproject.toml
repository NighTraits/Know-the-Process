[project]
name = "know-the-process"
version = "0.1.0"
description = "Consulta de procesos de trámites gubernamentales de Panamá"
readme = "README.md"
requires-python = "== 3.14.10"
dependencies = [
    "streamlit>=1.66.1",
    "langchain-google-genai>=4.4.2",
    "langchain-chroma>=1.1.0",
    "playwright>=1.64.1",
    "pydantic>=2.14.2",
    "pandas>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pylint>=4.1.3", 
    "pytest>=9.2.0", 
    "black>=26.10.1", 
    "isort>=9.0.2",
]

[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["test", "build", "dist*", "*.egg-info*"]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14.10"
pythonPlatform = "All"

include = ["."]

exclude = [
    "**/__pycache__",
    "**/build",
    "**/dist",
    "**/.venv",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/.*",
]

[tool.poetry]
package-mode = false

